<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#D6D6CE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="TALLOS · Palitos crocantes de garbanzo · Exhibidor 3D">
<title>TALLOS · Exhibidor 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>

<style>
@font-face{font-family:"Chivo Mono";src:url("fonts/ChivoMono.ttf") format("truetype");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;background:#D6D6CE;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
three-d-stage{display:block;position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none}
three-d-stage:not(:defined){visibility:hidden}
.ui{position:fixed;left:16px;top:16px;z-index:5;display:flex;flex-direction:column;gap:12px;font-family:"Chivo Mono",monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#000}
.grp{display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:4px}
.lbl{font-weight:600}
button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:#000;background:#D6D6CE;border:1px solid #000;border-radius:0;padding:6px 9px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
@media (hover:hover){button:hover{background:#F6D841}}
button.on{background:#000;color:#FFFFFF}
.brand{position:fixed;right:16px;top:16px;z-index:5;font-family:"Chivo Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#000;text-align:right;line-height:1.4}
.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;font-family:"Chivo Mono",monospace;font-size:11px;color:#000;text-transform:uppercase;letter-spacing:.04em}
.hint{position:fixed;left:16px;bottom:16px;z-index:4;font-family:"Chivo Mono",monospace;font-size:10px;color:#000;text-transform:uppercase;letter-spacing:.04em}
@media (max-width:760px){
  .ui{left:0;right:0;top:auto;bottom:0;flex-direction:row;gap:14px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#D6D6CE;border-top:1px solid #000;scrollbar-width:none}
  .ui::-webkit-scrollbar{display:none}
  .grp{flex:none}
  button{min-height:44px;padding:0 12px;font-size:12px}
  .brand{left:12px;right:auto;top:calc(12px + env(safe-area-inset-top));text-align:left}
  .hint{left:auto;right:12px;bottom:auto;top:calc(12px + env(safe-area-inset-top));text-align:right}
  three-d-stage{height:calc(100dvh - 92px - env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<three-d-stage name="tallos-exhibidor" background="#D6D6CE"></three-d-stage>
<div class="ui">
  <div class="grp"><span class="lbl">Contenido</span><div class="row" id="ui-cont"><button data-v="mixto" class="on">Mixto</button><button data-v="t001">T-001</button><button data-v="t002">T-002</button></div></div>
  <div class="grp"><span class="lbl">Envases sueltos</span><div class="row" id="ui-sueltos"><button data-v="no" class="on">No</button><button data-v="si">Sí</button></div></div>
  <div class="grp"><span class="lbl">Vista</span><div class="row" id="ui-vista"><button data-v="34">3/4</button><button data-v="frente">Frente</button><button data-v="lateral">Lateral</button><button data-v="cenital">Cenital</button></div></div>
  <div class="grp"><div class="row"><button id="ui-png">Guardar PNG</button></div></div>
</div>
<div class="brand">TALLOS<br>Exhibidor · 12 u.</div>
<div class="hint" id="hint"></div>
<div class="status" id="status">Cargando…</div>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const R = stage._renderer, S = stage._scene;
{ const st = document.createElement('style'); st.textContent = '.toolbar,.note{display:none!important}'; stage.shadowRoot.appendChild(st); }
const touch = matchMedia('(pointer:coarse)').matches;
document.getElementById('hint').textContent = touch ? '1 dedo: girar · 2 dedos: zoom' : 'Arrastrar: girar · rueda: zoom';
R.toneMapping = THREE.NeutralToneMapping;
R.toneMappingExposure = 1.0;
const aniso = R.capabilities.getMaxAnisotropy();

// Entorno de estudio (softboxes) para reflejos del film
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(12, 12, 12), new THREE.MeshBasicMaterial({ color: 0x3a3936, side: THREE.BackSide })));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshBasicMaterial({ color: 0x7d7c76 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.2; env.add(floor);
  const panel = (w, h, p, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide })); m.position.set(...p); m.lookAt(0, 0, 0); env.add(m); };
  panel(4.5, 2.6, [0.6, 5, 2.2], 7);
  panel(1.6, 4.5, [-5, 1.6, 1.8], 3.2);
  panel(1.4, 4, [5, 1.4, -1.5], 2.2);
  panel(7, 0.8, [0, 1.2, -5.5], 1.4);
  const pm = new THREE.PMREMGenerator(R);
  S.environment = pm.fromScene(env, 0.035).texture;
  S.environmentIntensity = 0.6;
}
S.traverse(o => { if (o.isHemisphereLight) o.intensity = 0.45; });
stage._key.intensity = 1.7;
stage._key.position.set(3, 7, 5);
stage._key.shadow.normalBias = 0.0006;
stage._key.shadow.radius = 4;
stage._ground.material.opacity = 0.32;

const loader = new THREE.TextureLoader();
const tex = async (p, srgb = true) => { const t = await loader.loadAsync(p); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso; return t; };
const canvasTex = (w, h, draw, srgb = false) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = aniso; return t; };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- Envase pillow ----------
const PW = 0.12, PH = 0.175, SEAL = 0.012, PT = 0.0165;
const sealFrac = SEAL / PH;

const pouchAlpha = canvasTex(256, 1024, (x, w, h) => {
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.fillStyle = '#000';
  const tooth = w / 60, depth = h * (0.0011 / PH);
  for (const top of [true, false]) { x.beginPath(); const y0 = top ? 0 : h; x.moveTo(0, y0);
    for (let i = 0; i <= 60; i++) x.lineTo(i * tooth, top ? (i % 2 ? depth : 0) : h - (i % 2 ? depth : 0));
    x.lineTo(w, y0); x.closePath(); x.fill(); }
});
const pouchBump = canvasTex(512, 1024, (x, w, h) => {
  x.fillStyle = 'rgb(128,128,128)'; x.fillRect(0, 0, w, h);
  const sh = h * sealFrac, step = w / 100;
  for (const y0 of [0, h - sh]) for (let i = 0; i < 100; i++) { x.fillStyle = i % 2 ? 'rgb(170,170,170)' : 'rgb(95,95,95)'; x.fillRect(i * step, y0 + 2, step, sh - 4); }
  x.fillStyle = 'rgb(150,150,150)'; x.fillRect(0, sh - 3, w, 3); x.fillRect(0, h - sh, w, 3);
  x.globalAlpha = 0.18;
  for (let k = 0; k < 70; k++) { const top = k % 2; const y = top ? sh + Math.random() * h * 0.12 : h - sh - Math.random() * h * 0.12; const xx = Math.random() * w;
    x.strokeStyle = Math.random() > .5 ? '#fff' : '#000'; x.lineWidth = 1 + Math.random() * 2; x.beginPath(); x.moveTo(xx, top ? sh : h - sh); x.lineTo(xx + (Math.random() - .5) * 60, y); x.stroke(); }
});

function profile(u, y) {
  const a = 2 * u - 1;
  const d = Math.min(y - SEAL, PH - SEAL - y);
  const e = d <= 0 ? 0 : 1 - Math.pow(1 - Math.min(d / 0.036, 1), 2.2);
  const p = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(a), 2.4)), 0.55);
  const wr = (1 - e) * e * 4 * 0.0013 * Math.sin(a * Math.PI * 6.5 + (y < PH / 2 ? 0 : 1.7));
  return { x: a * (PW / 2) * (1 - 0.07 * e), z: PT * e * p + wr * p + 0.0003 };
}
function pouchSurface(side, u0 = 0, u1 = 1, lift = 0, uvMap = null) {
  const nu = 44, nv = 96, pos = [], uv = [], idx = [];
  for (let j = 0; j <= nv; j++) { const v = j / nv, y = v * PH;
    for (let i = 0; i <= nu; i++) { const u = u0 + (u1 - u0) * i / nu; const q = profile(u, y);
      pos.push(q.x, y, side * (q.z + lift));
      if (uvMap) uv.push(...uvMap(i / nu, v)); else uv.push(side > 0 ? u : 1 - u, v); } }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) { const a = j * (nu + 1) + i, b = a + nu + 1;
    if (side > 0) idx.push(a, a + 1, b, a + 1, b + 1, b); else idx.push(a, b, a + 1, a + 1, b, b + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const filmMat = (name, map) => new THREE.MeshPhysicalMaterial({ name, map, roughness: 0.34, metalness: 0, clearcoat: 0.55, clearcoatRoughness: 0.22,
  bumpMap: pouchBump, bumpScale: 1.2, alphaMap: pouchAlpha, alphaTest: 0.5, side: THREE.DoubleSide });

const geo = { front: pouchSurface(1), back: pouchSurface(-1),
  fin: pouchSurface(-1, 0.47, 0.595, 0.0008, (s, v) => [1 - s, v]) };

const status = document.getElementById('status');
const V = {};
for (const k of ['T-001', 'T-002']) {
  const [f, b, full] = await Promise.all([tex(`tex/${k}_frente.jpg`), tex(`tex/${k}_dorso.jpg`), tex(`tex/${k}_aleta.jpg`)]);
  V[k] = { front: filmMat(`film_${k}_frente`, f), back: filmMat(`film_${k}_dorso`, b), fin: filmMat(`film_${k}_aleta`, full) };
}
function pouch(k, name) {
  const g = new THREE.Group(); g.name = name;
  for (const part of ['front', 'back', 'fin']) { const m = new THREE.Mesh(geo[part], V[k][part]); m.name = `${name}_${part}`; m.castShadow = m.receiveShadow = true; g.add(m); }
  return g;
}

// ---------- Caja exhibidor ----------
const BW = 0.255, BD = 0.27508, TB = 0.003;
const kraftIn = new THREE.MeshStandardMaterial({ name: 'kraft_interior', roughness: 0.92,
  map: canvasTex(512, 512, (x, w, h) => { x.fillStyle = '#C9A877'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${Math.random() > .5 ? '90,60,30' : '235,215,180'},${Math.random() * 0.12})`; x.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 5, 1); } }, true) });
kraftIn.map.wrapS = kraftIn.map.wrapT = THREE.RepeatWrapping; kraftIn.map.repeat.set(4, 4);
const flute = canvasTex(256, 64, (x, w, h) => { x.fillStyle = '#B8935F'; x.fillRect(0, 0, w, h); x.fillStyle = '#D9BE92'; x.fillRect(0, 0, w, 9); x.fillRect(0, h - 9, w, 9);
  x.strokeStyle = '#E2CBA2'; x.lineWidth = 5; x.beginPath(); for (let i = 0; i <= w; i++) x.lineTo(i, h / 2 + Math.sin(i / w * Math.PI * 2) * (h / 2 - 12)); x.stroke(); }, true);
flute.wrapS = flute.wrapT = THREE.RepeatWrapping; flute.repeat.set(1 / 0.0045, 1 / TB);
const kraftEdge = new THREE.MeshStandardMaterial({ name: 'kraft_canto', roughness: 1, map: flute });

const faces = {};
for (const [k, f] of [['frente', 'caja_frente'], ['dorso', 'caja_dorso'], ['izq', 'caja_lateral-izq'], ['der', 'caja_lateral-der']])
  faces[k] = new THREE.MeshStandardMaterial({ name: `carton_impreso_${k}`, map: await tex(`tex/${f}.jpg`), roughness: 0.82 });

function wall(name, w, hL, hR, mat) {
  const pts = [[0, 0], [w, 0], [w, hR]];
  const n = 60; for (let i = 1; i < n; i++) { const t = 1 - i / n; pts.push([w * t + (rnd() - .5) * 0.0004, hL + (hR - hL) * t + (rnd() - .5) * 0.0005]); }
  pts.push([0, hL]);
  const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  const g = new THREE.Group(); g.name = name;
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: TB, bevelEnabled: false, curveSegments: 1 }), [kraftIn, kraftEdge]);
  body.position.z = -TB; body.name = `${name}_carton`;
  const fg = new THREE.ShapeGeometry(shape); const p = fg.attributes.position, uv = [];
  for (let i = 0; i < p.count; i++) uv.push(p.getX(i) / w, p.getY(i) / 0.16);
  fg.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  const face = new THREE.Mesh(fg, mat); face.position.z = 0.0003; face.name = `${name}_impresion`;
  for (const m of [body, face]) { m.castShadow = m.receiveShadow = true; g.add(m); }
  return g;
}
const caja = new THREE.Group(); caja.name = 'caja_exhibidor';
const wF = wall('cara_frente', BW, 0.045, 0.045, faces.frente); wF.position.set(-BW / 2, 0, BD / 2);
const wR = wall('lateral_der', BD, 0.045, 0.100, faces.der); wR.position.set(BW / 2, 0, BD / 2); wR.rotation.y = Math.PI / 2;
const wB = wall('cara_dorso', BW, 0.100, 0.100, faces.dorso); wB.position.set(BW / 2, 0, -BD / 2); wB.rotation.y = Math.PI;
const wL = wall('lateral_izq', BD, 0.100, 0.045, faces.izq); wL.position.set(-BW / 2, 0, -BD / 2); wL.rotation.y = -Math.PI / 2;
const piso = new THREE.Mesh(new THREE.BoxGeometry(BW, TB, BD), kraftIn); piso.position.y = TB / 2; piso.name = 'piso'; piso.castShadow = piso.receiveShadow = true;
caja.add(wF, wR, wB, wL, piso);

const model = new THREE.Group(); model.name = 'TALLOS_exhibidor';
const contenido = new THREE.Group(); contenido.name = 'envases';
const sueltos = new THREE.Group(); sueltos.name = 'envases_sueltos';
model.add(caja, contenido, sueltos);

function fill(mode) {
  contenido.clear(); seed = 11;
  for (let r = 0; r < 6; r++) for (let c = 0; c < 2; c++) {
    const k = mode === 'mixto' ? (c === 0 ? 'T-001' : 'T-002') : mode === 't001' ? 'T-001' : 'T-002';
    const p = pouch(k, `envase_f${r + 1}_c${c + 1}`);
    p.position.set((c ? 1 : -1) * 0.0615 + (rnd() - .5) * 0.003, TB, BD / 2 - TB - 0.019 - r * 0.0415);
    p.rotation.set(-0.11 - rnd() * 0.04, (rnd() - .5) * 0.04, (rnd() - .5) * 0.025, 'YXZ');
    contenido.add(p);
  }
}
function loose(on) {
  sueltos.clear(); if (!on) return;
  const a = pouch('T-001', 'suelto_T-001'); const ga = new THREE.Group(); ga.add(a);
  a.rotation.x = -Math.PI / 2; a.position.set(0, PT + 0.0005, PH / 2); ga.position.set(0.12, 0, 0.30); ga.rotation.y = 0.22; sueltos.add(ga);
  const b = pouch('T-002', 'suelto_T-002'); const gb = new THREE.Group(); gb.add(b);
  b.rotation.x = -Math.PI / 2; b.position.set(0, PT + 0.0005, PH / 2); gb.position.set(-0.135, 0, 0.275); gb.rotation.y = -0.16; sueltos.add(gb);
}
fill('mixto');
stage.setObject(model);
status.textContent = '';

const target0 = stage._controls.target.clone();
const dist0 = stage._camera.position.distanceTo(target0);
stage._controls.minDistance = dist0 * 0.25; stage._controls.maxDistance = dist0 * 2.2; stage._controls.maxPolarAngle = Math.PI / 2 - 0.03;
const views = { '34': [0.62, 0.62, 1], frente: [0, 0.32, 1], lateral: [1, 0.35, 0.25], cenital: [0.15, 1.7, 0.55] };
let curView = '34';
function view(v) { curView = v; const d = new THREE.Vector3(...views[v]).normalize().multiplyScalar(dist0 * (v === 'cenital' ? 1.05 : 0.95) * (sueltos.children.length ? 1.2 : 1));
  stage._controls.target.copy(target0); stage._camera.position.copy(target0).add(d); stage._controls.update(); }
view('34');

const group = (id, fn) => { const el = document.getElementById(id); el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); }); };
group('ui-cont', fill);
group('ui-sueltos', v => { loose(v === 'si'); view(curView); });
group('ui-vista', view);
document.getElementById('ui-png').addEventListener('click', () => {
  const old = R.getPixelRatio(), w = stage.clientWidth, h = stage.clientHeight;
  R.setPixelRatio(Math.min(3, 4096 / Math.max(w, h))); R.setSize(w, h); R.render(S, stage._camera);
  const a = document.createElement('a'); a.href = R.domElement.toDataURL('image/png'); a.download = 'TALLOS-exhibidor.png'; a.click();
  R.setPixelRatio(old); R.setSize(w, h);
});
</script>
</body>
</html>
